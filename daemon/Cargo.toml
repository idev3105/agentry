[package]
name    = "agentry-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agentry-daemon"
path = "src/main.rs"

[dependencies]
agentry-wire = { path = "../crates/wire" }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
uuid         = { workspace = true }
base64       = { workspace = true }
rusqlite     = { version = "0.31", features = ["bundled"] }
portable-pty = "0.8"
notify       = "6"
nix          = { version = "0.29", features = ["signal", "process"] }
anyhow       = "1"
tracing      = "0.1"
ctrlc        = "3"
futures      = "0.3"