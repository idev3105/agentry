# Dev toolchain cho Agentry (xem docs/implementation-plan.md)
[tools]
rust = "stable"        # daemon + Tauri shim (cargo, rustc, clippy, rustfmt)
node = "24"            # SvelteKit frontend (LTS)
pnpm = "11"            # package manager
java = "temurin-21"    # required by Android sdkmanager/Gradle
"android-sdk" = "20.0" # Android cmdline-tools; sets ANDROID_HOME/ANDROID_SDK_ROOT
                       # SDK packages (platform-tools, emulator, ndk, system-images)
                       # installed into $ANDROID_HOME via: sdkmanager "<pkg>"

# Tauri v2 trên Ubuntu còn cần system libs (apt) — không quản qua mise:
#   sudo apt install libwebkit2gtk-4.1-dev build-essential curl wget file \
#     libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

# WebKit/GTK env workarounds cho Ubuntu Wayland (segfault prevention)
[env]
GDK_BACKEND = "x11"
WEBKIT_DISABLE_DMABUF_RENDERER = "1"

[tasks.install]
description = "Install all project deps: pnpm node_modules + cargo-watch + cargo fetch (+ warn on missing apt libs)"
run = """
#!/usr/bin/env bash
set -e

echo "==> pnpm install (gui/node_modules)"
(cd gui && pnpm install)

echo "==> cargo-watch (used by 'mise run daemon')"
cargo watch --version >/dev/null 2>&1 || cargo install cargo-watch

echo "==> cargo fetch (prefetch Rust crate deps)"
cargo fetch

echo "==> Checking system libs (Tauri v2 — not managed by mise)"
if [ "$(uname -s)" = "Linux" ] && command -v dpkg >/dev/null 2>&1; then
  missing=""
  for pkg in build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev; do
    dpkg -s "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
  done
  if [ -n "$missing" ]; then
    echo "⚠️  Missing apt packages:$missing"
    echo "    Run: sudo apt install curl wget file$missing"
  else
    echo "✓ system libs OK"
  fi
else
  echo "✓ macOS — WebKit built-in, no apt deps needed"
fi

echo "Done. Run 'mise run dev' to start."
"""

[tasks.daemon]
description = "Build và chạy daemon ở dev mode (watch)"
run = "cargo watch -x 'run -p agentry-daemon' 2>/dev/null || cargo run -p agentry-daemon"
dir = "{{cwd}}"

[tasks.gui]
description = "Chạy SvelteKit frontend dev server (vite)"
run = "pnpm dev"
dir = "{{cwd}}/gui"

[tasks.tauri]
description = "Chạy Tauri app ở dev mode (frontend + shim cùng lúc)"
run = "pnpm tauri:dev"
dir = "{{cwd}}/gui"

[tasks.dev]
description = "Chạy daemon + Tauri GUI cùng lúc (dev mode đầy đủ)"
run = """
#!/usr/bin/env bash
set -e
echo "Building daemon..."
cargo build -p agentry-daemon
echo "Starting daemon in background..."
cargo run -p agentry-daemon &
DAEMON_PID=$!
trap "kill $DAEMON_PID 2>/dev/null" EXIT
echo "Starting Tauri dev..."
cd gui && pnpm tauri:dev
"""

[tasks.build]
description = "Build toàn bộ project (daemon + GUI)"
run = """
#!/usr/bin/env bash
set -e
cargo build --release -p agentry-daemon -p agentry-cli
cd gui && pnpm tauri:build
"""

[tasks.check]
description = "Type-check Rust (clippy) + Svelte (svelte-check)"
run = """
#!/usr/bin/env bash
set -e
cargo clippy -p agentry-wire -p agentry-daemon -p agentry-cli -- -D warnings
cd gui && pnpm check
"""

[tasks.cli]
description = "Chạy CLI test client (AGENTRY_SOCK nếu daemon đang chạy)"
run = "cargo run -p agentry-cli --"
dir = "{{cwd}}"

[tasks.kill]
description = "Kill mọi process Agentry (daemon + GUI shim + Tauri/Vite) và dọn socket/pid"
run = """
#!/usr/bin/env bash
pkill -TERM -f 'agentry-daemon'   2>/dev/null || true
pkill -TERM -f 'agentry-gui'      2>/dev/null || true
pkill -TERM -f 'tauri.js dev'     2>/dev/null || true
pkill -TERM -f 'vite.*gui'        2>/dev/null || true
sleep 0.3
pkill -KILL -f 'agentry-daemon'   2>/dev/null || true
pkill -KILL -f 'agentry-gui'      2>/dev/null || true
pkill -KILL -f 'tauri.js dev'     2>/dev/null || true
pkill -KILL -f 'vite.*gui'        2>/dev/null || true
rm -f "$HOME/.agentry/daemon.pid" "$HOME/.agentry/daemon.sock" "$HOME/.agentry/daemon.log"
echo "agentry: killed daemon/GUI/dev processes and cleaned runtime files"
"""

[tasks.reset]
description = "Như 'kill' nhưng XÓA cả database — fresh start (mất hết projects/profiles/sessions)"
run = """
#!/usr/bin/env bash
mise run kill
rm -f "$HOME/.agentry/daemon.db" "$HOME/.agentry/daemon.db-shm" "$HOME/.agentry/daemon.db-wal"
echo "agentry: database wiped"
"""

# ── Android ──────────────────────────────────────────────────────────────────

[tasks.android-setup]
description = "Xác nhận Android SDK đã được cài qua mise (platform-tools, emulator, ndk, system-images)"
run = """
#!/usr/bin/env bash
set -e
echo "ANDROID_HOME=$ANDROID_HOME"
echo -n "adb: "; "$ANDROID_HOME/platform-tools/adb" version 2>/dev/null | head -1 || echo "NOT FOUND — run: sdkmanager platform-tools"
echo -n "emulator: "; "$ANDROID_HOME/emulator/emulator" -version 2>/dev/null | head -1 || echo "NOT FOUND — run: sdkmanager emulator"
echo -n "ndk: "; ls "$ANDROID_HOME/ndk" 2>/dev/null | head -3 || echo "NOT FOUND — run: sdkmanager 'ndk;27.0.12077973'"
"""

[tasks.android-build]
description = "Build APK debug cho Android"
run = """
#!/usr/bin/env bash
set -e
export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
cd gui && pnpm tauri android build --debug
"""

[tasks.android-install]
description = "Cài APK debug lên Android device qua adb"
run = """
#!/usr/bin/env bash
set -e
ADB="$ANDROID_HOME/platform-tools/adb"
APK="gui/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
if [ ! -f "$APK" ]; then
  echo "APK not found, building first..."
  mise run android-build
fi
"$ADB" install -r "$APK"
echo "Done. Launch app on device."
"""

[tasks.android-run]
description = "Build APK debug + start emulator (nếu cần) + install + launch"
run = """
#!/usr/bin/env bash
set -e
ADB="$ANDROID_HOME/platform-tools/adb"
EMU="$ANDROID_HOME/emulator/emulator"
mise run android-build
APK="gui/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
# Start emulator nếu chưa có device nào
if ! "$ADB" devices | grep -qE "emulator|device$"; then
  AVD=$("$EMU" -list-avds | head -1)
  if [ -z "$AVD" ]; then echo "No AVD found. Run: mise run android-avd"; exit 1; fi
  echo "Starting emulator $AVD..."
  "$EMU" -avd "$AVD" -no-snapshot-load &
  "$ADB" wait-for-device
  # Chờ boot hoàn tất
  until [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null)" = "1" ]; do sleep 2; done
  echo "Emulator ready."
fi
"$ADB" install -r "$APK"
"$ADB" shell am start -n dev.agentry.app/.MainActivity
echo "Done."
"""

[tasks.android-dev]
description = "Tauri Android dev mode — hot-reload trên device/emulator"
run = """
#!/usr/bin/env bash
set -e
export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
cargo build -p agentry-daemon
cargo run -p agentry-daemon &
DAEMON_PID=$!
trap "kill $DAEMON_PID 2>/dev/null" EXIT
cd gui && pnpm tauri android dev
"""

[tasks.android-avd]
description = "Tạo AVD Pixel_9a (android-34, arm64) qua avdmanager — thay cho Android Studio"
run = """
#!/usr/bin/env bash
set -e
AVD="${1:-Pixel_9a}"
IMG="system-images;android-34;google_apis;arm64-v8a"
if "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx "$AVD"; then
  echo "AVD '$AVD' already exists."; exit 0
fi
echo "Creating AVD '$AVD' from $IMG..."
printf "no\n" | avdmanager create avd -n "$AVD" -k "$IMG" --force
echo "Done. Start with: emulator -avd $AVD  (or 'mise run android-run')"
"""

[tasks.android-log]
description = "Xem logcat realtime của app Agentry (lọc tag liên quan)"
run = """
#!/usr/bin/env bash
ADB="$ANDROID_HOME/platform-tools/adb"
echo "Clearing logcat buffer..."
"$ADB" logcat -c
echo "Tailing logcat (Ctrl+C to stop)..."
"$ADB" logcat | grep -E "agentry|dev\\.agentry|Tauri|Console|RustStdout|chromium"
"""

