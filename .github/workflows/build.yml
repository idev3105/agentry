name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, rust_target: aarch64-apple-darwin }
          - { name: macos-x64,   rust_target: x86_64-apple-darwin }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: gui
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Clippy
        run: cargo clippy -p agentry-wire -p agentry-daemon -p agentry-cli -- -D warnings

      - name: svelte-check
        working-directory: gui
        run: pnpm check

      - name: Build daemon + CLI (release)
        run: cargo build --release -p agentry-daemon -p agentry-cli --target ${{ matrix.rust_target }}

      - name: Build Tauri app
        working-directory: gui
        run: pnpm tauri build --target ${{ matrix.rust_target }}

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: agentry-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.rust_target }}/release/bundle/macos/*.app
            target/${{ matrix.rust_target }}/release/agentry-daemon
            target/${{ matrix.rust_target }}/release/agentry-cli
          retention-days: 14
          if-no-files-found: error
