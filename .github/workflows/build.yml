name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,     name: macos-arm64,  rust_target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, name: linux-x64,    rust_target: x86_64-unknown-linux-gnu }
          - { os: windows-2022, name: windows-x64,  rust_target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Clippy
        run: cargo clippy -p agentry-wire -p agentry-daemon -p agentry-cli -- -D warnings

      - name: svelte-check
        working-directory: gui
        run: pnpm check

      - name: Build daemon + CLI (release)
        run: cargo build --release -p agentry-daemon -p agentry-cli

      - name: Build Tauri app
        working-directory: gui
        run: pnpm tauri:build
        env:
          GDK_BACKEND: ${{ matrix.os == 'ubuntu-22.04' && 'x11' || '' }}
          WEBKIT_DISABLE_DMABUF_RENDERER: ${{ matrix.os == 'ubuntu-22.04' && '1' || '' }}

      - name: List Linux bundle outputs
        if: matrix.os == 'ubuntu-22.04'
        run: ls -la target/release/bundle/

      - name: Upload macOS bundle
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: agentry-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          retention-days: 14
          if-no-files-found: error

      - name: Upload Linux bundle
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: agentry-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error

      - name: Upload Windows bundle
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: agentry-${{ matrix.name }}-${{ github.sha }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
