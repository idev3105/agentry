name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Build daemon + CLI (release)
        run: cargo build --release -p agentry-daemon -p agentry-cli --target ${{ matrix.target }}

      - name: Build Tauri app
        working-directory: gui
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        run: |
          set -e
          OUT="dist/${{ matrix.arch }}"
          mkdir -p "$OUT"
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          # .app + .dmg from Tauri bundle
          find "$BUNDLE/macos" -maxdepth 1 -name "*.app" -exec cp -R {} "$OUT/" \; 2>/dev/null || true
          find "$BUNDLE/dmg"   -maxdepth 1 -name "*.dmg" -exec cp {} "$OUT/" \; 2>/dev/null || true
          # daemon + cli binaries
          cp "target/${{ matrix.target }}/release/agentry-daemon" "$OUT/" 2>/dev/null || true
          cp "target/${{ matrix.target }}/release/agentry-cli"    "$OUT/" 2>/dev/null || true
          echo "==> Artifacts for ${{ matrix.arch }}:"
          ls -la "$OUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentry-macos-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/**
          if-no-files-found: error
